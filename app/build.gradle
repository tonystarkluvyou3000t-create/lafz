plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lafz.app'
    compileSdk 36

    androidResources {
        noCompress += ['dbz']
    }

    defaultConfig {
        applicationId 'com.lafz.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner providers.gradleProperty('testRunner').getOrElse('com.lafz.app.LearningInstrumentation')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
